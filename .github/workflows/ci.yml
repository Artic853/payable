name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  benchmark:
    # The benchmark is the project's central claim, so CI reproduces it rather
    # than trusting the committed report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduce the benchmark across five seeds
        run: |
          python -m payable.bench.runner --repeats 5             --md-out benchmark-ci.md             --digest-out digest-ci.json

      - name: Assert the results are reproducible on this machine
        # The digest holds every decision the run made and no timing, so it must
        # match byte-for-byte on any machine. If it does not, the benchmark is
        # not deterministic and none of its numbers mean anything.
        run: |
          if ! diff -u data/benchmark-digest.json digest-ci.json; then
            echo "::error::Benchmark results differ from the committed digest."
            echo "Either a change altered the results (regenerate the digest and"
            echo "the report), or the benchmark is not deterministic."
            exit 1
          fi
          echo "Benchmark reproduced exactly."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: |
            benchmark-ci.md
            digest-ci.json
            data/benchmark.json
